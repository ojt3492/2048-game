<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>2048</title>
<style>
  :root {
    --board-bg: #bbada0;
    --cell-bg: rgba(238, 228, 218, 0.35);
    --text-dark: #776e65;
    --text-light: #f9f6f2;
    --tile-2: #eee4da;
    --tile-4: #ede0c8;
    --tile-8: #f2b179;
    --tile-16: #f59563;
    --tile-32: #f67c5f;
    --tile-64: #f65e3b;
    --tile-128: #edcf72;
    --tile-256: #edcc61;
    --tile-512: #edc850;
    --tile-1024: #edc53f;
    --tile-2048: #edc22e;
    --tile-super: #3c3a32;
    --page-bg: #faf8ef;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page-bg);
    font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    color: var(--text-dark);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    gap: 12px;
  }

  h1 {
    font-size: 48px;
    margin: 0;
    font-weight: 800;
    color: #4a4038;
  }

  .subtitle {
    margin: 6px 0 0;
    font-size: 14px;
    line-height: 1.5;
    color: #7a7268;
    max-width: 220px;
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score-box {
    background: var(--board-bg);
    border-radius: 6px;
    padding: 8px 16px;
    text-align: center;
    color: var(--text-light);
    min-width: 68px;
  }

  .score-box .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    opacity: 0.8;
  }

  .score-box .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .hint {
    font-size: 13px;
    color: #7a7268;
  }

  .new-game-btn {
    background: #8f7a66;
    color: var(--text-light);
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .new-game-btn:hover { background: #7a6754; }
  .new-game-btn:active { transform: translateY(1px); }

  .board-container {
    position: relative;
    background: var(--board-bg);
    border-radius: 8px;
    padding: 10px;
    aspect-ratio: 1 / 1;
    width: 100%;
    touch-action: none;
  }

  .grid-bg {
    position: absolute;
    inset: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }

  .cell {
    background: var(--cell-bg);
    border-radius: 4px;
  }

  .tile-layer {
    position: absolute;
    inset: 10px;
  }

  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    font-weight: 700;
    width: calc(25% - 7.5px);
    height: calc(25% - 7.5px);
    transition: top 0.12s ease-in-out, left 0.12s ease-in-out;
    will-change: top, left;
  }

  .tile-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    animation: appear 0.15s ease;
  }

  .tile-inner.merged {
    animation: pop 0.18s ease;
  }

  @keyframes appear {
    from { transform: scale(0); opacity: 0.5; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 4px;
    background: rgba(238, 228, 218, 0.73);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-title {
    font-size: 34px;
    font-weight: 800;
    color: #4a4038;
  }

  .overlay button {
    background: #8f7a66;
    color: var(--text-light);
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .overlay .keep-going {
    background: transparent;
    color: #4a4038;
    text-decoration: underline;
    padding: 4px;
  }

  footer {
    margin-top: 20px;
    font-size: 13px;
    color: #9a9086;
    text-align: center;
    line-height: 1.6;
  }

  @media (prefers-color-scheme: dark) {
    :root { --page-bg: #1b1a17; }
    body { color: #e8e2d8; }
    h1 { color: #f2ece2; }
    .subtitle, .hint, footer { color: #a49a8c; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>2048</h1>
      <p class="subtitle">타일을 합쳐서 2048을 만들어보세요!</p>
    </div>
    <div class="scores">
      <div class="score-box">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">BEST</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <span class="hint">방향키 / WASD / 스와이프로 이동</span>
    <button class="new-game-btn" id="newGameBtn">새 게임</button>
  </div>

  <div class="board-container" id="board">
    <div class="grid-bg" id="gridBg"></div>
    <div class="tile-layer" id="tileLayer"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlayTitle">Game Over!</div>
      <button id="overlayRestart">다시 시작</button>
      <button class="keep-going" id="keepGoing" style="display:none;">계속하기</button>
    </div>
  </div>

  <footer>2048 타일이 만들어지면 승리! 더 큰 타일에 계속 도전해보세요.</footer>
</div>

<script>
(function () {
  const SIZE = 4;
  const STORAGE_KEY = '2048-best-score';
  const boardEl = document.getElementById('board');
  const tileLayer = document.getElementById('tileLayer');
  const gridBg = document.getElementById('gridBg');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const keepGoingBtn = document.getElementById('keepGoing');
  const newGameBtn = document.getElementById('newGameBtn');
  const overlayRestartBtn = document.getElementById('overlayRestart');

  let grid, score, best, won, keepPlayingAfterWin, tileIdCounter, gap;

  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    gridBg.appendChild(c);
  }

  function loadBest() {
    const v = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
    return isNaN(v) ? 0 : v;
  }

  function saveBest(v) {
    try { localStorage.setItem(STORAGE_KEY, String(v)); } catch (e) {}
  }

  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  }

  function newTile(row, col, value) {
    tileIdCounter++;
    return { id: tileIdCounter, row, col, value, isNew: true, merged: false, prevRow: row, prevCol: col };
  }

  function randomEmptyCell() {
    const empties = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) empties.push([r, c]);
      }
    }
    if (empties.length === 0) return null;
    return empties[Math.floor(Math.random() * empties.length)];
  }

  function addRandomTile() {
    const cell = randomEmptyCell();
    if (!cell) return;
    const value = Math.random() < 0.9 ? 2 : 4;
    const t = newTile(cell[0], cell[1], value);
    grid[cell[0]][cell[1]] = t;
  }

  function init() {
    grid = emptyGrid();
    score = 0;
    won = false;
    keepPlayingAfterWin = false;
    tileIdCounter = 0;
    best = loadBest();
    addRandomTile();
    addRandomTile();
    overlay.classList.remove('show');
    keepGoingBtn.style.display = 'none';
    updateScoreUI();
    render(true);
  }

  function updateScoreUI() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      saveBest(best);
    }
    bestEl.textContent = best;
  }

  function cloneGridFlags() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (t) {
          t.prevRow = t.row;
          t.prevCol = t.col;
          t.isNew = false;
          t.merged = false;
        }
      }
    }
  }

  function moveVector(dir) {
    switch (dir) {
      case 'up': return { dr: -1, dc: 0 };
      case 'down': return { dr: 1, dc: 0 };
      case 'left': return { dr: 0, dc: -1 };
      case 'right': return { dr: 0, dc: 1 };
    }
  }

  function traversalOrder(dir) {
    const rows = [0, 1, 2, 3];
    const cols = [0, 1, 2, 3];
    if (dir === 'down') rows.reverse();
    if (dir === 'right') cols.reverse();
    return { rows, cols };
  }

  function inBounds(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  }

  function move(dir) {
    if (overlay.classList.contains('show') && !keepPlayingAfterWin) return;
    cloneGridFlags();
    const { dr, dc } = moveVector(dir);
    const { rows, cols } = traversalOrder(dir);
    let moved = false;
    let gainedScore = 0;

    for (const r of rows) {
      for (const c of cols) {
        const tile = grid[r][c];
        if (!tile) continue;

        let curR = r, curC = c;
        let nextR = curR + dr, nextC = curC + dc;

        while (inBounds(nextR, nextC) && !grid[nextR][nextC]) {
          curR = nextR; curC = nextC;
          nextR = curR + dr; nextC = curC + dc;
        }

        if (inBounds(nextR, nextC) && grid[nextR][nextC] &&
            grid[nextR][nextC].value === tile.value && !grid[nextR][nextC].merged) {
          const target = grid[nextR][nextC];
          grid[r][c] = null;
          target.value *= 2;
          target.merged = true;
          tile.row = nextR; tile.col = nextC;
          grid[nextR][nextC] = target;
          tile._mergeInto = target;
          gainedScore += target.value;
          moved = true;
          if (target.value === 2048 && !won) won = true;
        } else {
          if (curR !== r || curC !== c) {
            grid[r][c] = null;
            grid[curR][curC] = tile;
            tile.row = curR; tile.col = curC;
            moved = true;
          }
        }
      }
    }

    if (!moved) return;

    score += gainedScore;
    updateScoreUI();
    addRandomTile();
    render(false);

    if (won && !keepPlayingAfterWin) {
      setTimeout(showWin, 180);
    } else if (isGameOver()) {
      setTimeout(showGameOver, 180);
    }
  }

  function isGameOver() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return false;
      }
    }
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c].value;
        if (c + 1 < SIZE && grid[r][c + 1].value === v) return false;
        if (r + 1 < SIZE && grid[r + 1][c].value === v) return false;
      }
    }
    return true;
  }

  function showGameOver() {
    overlayTitle.textContent = 'Game Over!';
    keepGoingBtn.style.display = 'none';
    overlay.classList.add('show');
  }

  function showWin() {
    overlayTitle.textContent = 'You Win! 🎉';
    keepGoingBtn.style.display = 'inline-block';
    overlay.classList.add('show');
  }

  function tileColor(value) {
    const known = [2,4,8,16,32,64,128,256,512,1024,2048];
    if (known.includes(value)) {
      return `var(--tile-${value})`;
    }
    return 'var(--tile-super)';
  }

  function tileTextColor(value) {
    return value <= 4 ? 'var(--text-dark)' : 'var(--text-light)';
  }

  function tileFontSize(value) {
    const len = String(value).length;
    if (len <= 2) return '38px';
    if (len === 3) return '30px';
    if (len === 4) return '24px';
    return '18px';
  }

  function computeGap() {
    const rect = boardEl.getBoundingClientRect();
    const inner = rect.width - 20;
    return { cellSize: (inner - 30) / 4, gap: 10, inner };
  }

  function positionFor(row, col) {
    const { cellSize, gap } = computeGap();
    return {
      top: row * (cellSize + gap),
      left: col * (cellSize + gap)
    };
  }

  function render(initial) {
    tileLayer.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) continue;
        const tileEl = document.createElement('div');
        tileEl.className = 'tile';
        const fromPos = initial ? positionFor(t.row, t.col) : positionFor(t.prevRow, t.prevCol);
        tileEl.style.top = fromPos.top + 'px';
        tileEl.style.left = fromPos.left + 'px';

        const inner = document.createElement('div');
        inner.className = 'tile-inner';
        inner.style.background = tileColor(t.value);
        inner.style.color = tileTextColor(t.value);
        inner.style.fontSize = tileFontSize(t.value);
        inner.textContent = t.value;
        if (t.merged && !initial) inner.classList.add('merged');
        tileEl.appendChild(inner);
        tileLayer.appendChild(tileEl);

        if (!initial && (t.row !== t.prevRow || t.col !== t.prevCol)) {
          requestAnimationFrame(() => {
            const toPos = positionFor(t.row, t.col);
            tileEl.style.top = toPos.top + 'px';
            tileEl.style.left = toPos.left + 'px';
          });
        } else if (initial && t.isNew) {
          // appear animation handled by CSS
        }
      }
    }
  }

  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right',
      W: 'up', S: 'down', A: 'left', D: 'right'
    };
    const dir = map[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  let touchStartX = 0, touchStartY = 0;
  boardEl.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  boardEl.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    const threshold = 24;
    if (Math.max(absX, absY) < threshold) return;
    if (absX > absY) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  newGameBtn.addEventListener('click', init);
  overlayRestartBtn.addEventListener('click', init);
  keepGoingBtn.addEventListener('click', () => {
    keepPlayingAfterWin = true;
    overlay.classList.remove('show');
  });

  window.addEventListener('resize', () => render(true));

  init();
})();
</script>
</body>
</html>
